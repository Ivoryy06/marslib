services:
  - type: web
    name: marslib
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FORCE_HTTPS
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marslib-db
          property: connectionString

databases:
  - name: marslib-db
    databaseName: marslib
    plan: free
